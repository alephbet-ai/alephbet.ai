# yaml-language-server: $schema=https://docs.coderabbit.ai/schema.json
language: en-US
reviews:
  # quiet | chill | assertive — chill keeps reviews friendly, not nitpicky.
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
  path_filters:
    - "!dist/**"
    - "!**/*.min.*"
    - "!package-lock.json"
  path_instructions:
    - path: "src/**/*.astro"
      instructions: >-
        This is an Astro + Tailwind CSS v4 project. Flag any Tailwind classes
        assembled via string concatenation that would hide class names from
        Tailwind's content scanner — dynamic classes must appear as complete
        string literals. Prefer semantic HTML and keep the monochrome (zinc)
        palette consistent.
chat:
  auto_reply: true
